name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Exact version to release instead (e.g. 1.2.0). Leave empty to use the bump.
        type: string
        required: false

permissions: {}

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build.sh uses the commit count as the build number

      - name: Bump VERSION and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::Run this workflow from main."
            exit 1
          fi
          CURRENT=$(tr -d '[:space:]' < VERSION)
          if [ -n "${INPUT_VERSION}" ]; then
            NEW="${INPUT_VERSION#v}"
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "${CURRENT}"
            case "${BUMP}" in
              major) NEW="$((MAJOR + 1)).0.0" ;;
              minor) NEW="${MAJOR}.$((MINOR + 1)).0" ;;
              *)     NEW="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
          fi
          if ! echo "${NEW}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version ${NEW} isn't in the form X.Y.Z."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${NEW}" >/dev/null; then
            echo "::error::Tag v${NEW} already exists."
            exit 1
          fi
          echo "Releasing ${CURRENT} -> ${NEW}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${NEW}" != "${CURRENT}" ]; then
            echo "${NEW}" > VERSION
            git commit -am "Release v${NEW}"
          fi
          git tag "v${NEW}"
          git push origin HEAD:main "v${NEW}"

      - name: Check tag matches VERSION
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="v${VERSION}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION file (${VERSION}). Expected tag ${TAG}."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./build.sh

      - name: Package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir dmg
          cp -R build/Soroban.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Soroban -srcfolder dmg -fs HFS+ -format UDZO -ov "Soroban-${TAG}.dmg"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cat > notes.md <<'EOF'
          ## Install

          ```sh
          curl -fsSL https://raw.githubusercontent.com/flikkr/soroban/main/install.sh | sh
          ```

          Or install it by hand:

          1. Download `Soroban-${{ steps.version.outputs.tag }}.dmg` below, open it and drag `Soroban.app` to `Applications`.
          2. The app isn't notarized, so macOS will block it the first time. Clear the quarantine flag:
             ```sh
             xattr -dr com.apple.quarantine /Applications/Soroban.app
             ```
          3. Open it: `open /Applications/Soroban.app`

          Requires macOS 13 or later.

          EOF
          # GitHub's generated notes, without the "New Contributors" section.
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" --jq .body \
            | awk '/^## New Contributors/ { skip = 1; next } /^\*\*Full Changelog\*\*/ { skip = 0 } !skip' \
            >> notes.md
          gh release create "${TAG}" "Soroban-${TAG}.dmg" \
            --title "Soroban ${TAG}" \
            --notes-file notes.md \
            --verify-tag
